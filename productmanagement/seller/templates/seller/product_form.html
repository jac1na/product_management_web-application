
<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>

    <style>
        body {
            margin: 0;
            padding: 40px 15px;
            background: #f8f6f1;
            font-family: 'Segoe UI', sans-serif;
            color: #302a23;
        }

        .form-container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.05);
        }

        h1 {
            color: #92713f;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd5c9;
            border-radius: 6px;
            font-size: 15px;
        }

        input[type=file] {
            background: #faf8f4;
        }

        button {
            background: #92713f;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
        }

        .back {
            color: #92713f;
            text-decoration: none;
            margin-left: 15px;
        }

        .errorlist {
            color: #b34238;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>{{ title }}</h1>

    <p>Add jewellery product details below.</p>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.non_field_errors }}

        <label>Product Name</label>
        {{ form.name }}
        {{ form.name.errors }}

        <label>Product Photo</label>
        {{ form.photo }}
        {{ form.photo.errors }}

        <label>Price (₹)</label>
        {{ form.price }}
        {{ form.price.errors }}

        <label>Description</label>
        {{ form.description }}
        {{ form.description.errors }}

        <br>

        <button type="submit">Save Product</button>

        <a href="{% url 'dashboard' %}" class="back">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
